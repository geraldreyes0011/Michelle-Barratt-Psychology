    <path d="M122 144c8-24 28-36 50-36-6 24-26 36-50 36z" fill="#004C54" fill-opacity=".75" />
    <path d="M132 108c-20-14-44-16-58-6 16 16 40 18 58 6z" fill="#FFD200" fill-opacity=".9" />
    <path d="M144 76c6-20 22-32 42-32-6 20-22 32-42 32z" fill="#6E9F9A" fill-opacity=".9" />
    <path d="M152 48c-14-12-32-14-42-8 12 12 28 14 42 8z" fill="#2E6F7A" fill-opacity=".8" />
