<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" fill="none">
  <!-- MBP brand graphic: deep-teal and sage leaves on a curving stem with a single yellow leaf and a
       soft turquoise wash (after the leaf tiles in the "Brand patterns & graphics" reference).
       Transparent background. -->
  <defs>
    <filter id="wash" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="10" />
    </filter>
    <filter id="leaf" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="6" />
      <feDisplacementMap in="SourceGraphic" scale="3" />
    </filter>
  </defs>
  <path filter="url(#wash)" d="M54 70c40-26 104-12 122 34 18 48-6 112-56 130-48 18-98-10-104-58-5-40 8-84 38-106z" fill="#A9C0C8" fill-opacity=".35" />
